<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in - SkillBridge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><div class="authwrap"><form class="card auth" onsubmit="return login(event)"><h2>Welcome back</h2><p class="muted">Log in to continue your preparation.</p><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><p id="err" class="err" role="alert"></p><button class="btn lg" style="width:100%">Log in</button><p style="margin:20px 0 0;text-align:center" class="muted">New here? <a href="signup.html">Create an account</a></p></form></div><script src="js/data.js"></script><script src="js/app.js"></script><script>
async function login(e){e.preventDefault();const em=email.value.trim().toLowerCase(),h=await hash(pw.value);
 const u=DB.users.find(x=>x.email==em&&(x.pwh==h||x.pw==pw.value));
 if(!u){err.textContent="Email or password is wrong.";return false}
 if(u.pw){u.pwh=h;delete u.pw;persist(u)}DB.user=u;location.href="dashboard.html";return false}
</script></body></html>
