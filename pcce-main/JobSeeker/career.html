<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career insights - SkillBridge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-auth="1"><div id="nav"></div><main><div class="page-head"><div><h1>Career insights</h1><p>Your skill gaps and an AI-built plan for <b id="r"></b>.</p></div></div>
<div class="g2"><div class="card"><h2>Skills found</h2><div id="have" style="margin-bottom:28px"></div><h2>Missing, in priority order</h2><div id="miss"></div><p style="margin:24px 0 0"><a class="btn" href="education.html">Fix gaps in Learning</a></p></div>
<div class="card" style="display:grid;place-items:center;align-content:center;text-align:center"><div id="rg"></div><h3 style="margin-top:12px">Skill score</h3><p class="muted" style="margin:0" id="pj"></p></div></div>
<div class="card" style="margin-top:24px"><div class="row"><div><h2 style="margin:0">AI career roadmap</h2><p class="muted" style="margin:4px 0 0">Personalised by Gemini from your resume and gaps.</p></div><span class="sp"></span><button class="btn" id="go" onclick="insights()">Generate with AI</button></div><div id="ai" style="margin-top:24px"></div></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>
const u=DB.user,a=analyse(u);r.textContent=u.role;rg.innerHTML=ring(a.score,170);pj.textContent=a.projects+" project(s) detected";
have.innerHTML=a.have.map(s=>`<span class="tag">${esc(s)}</span>`).join("")||"<p class=muted>No skills detected yet. Save a resume first.</p>";
miss.innerHTML=a.missing.map((s,i)=>`<span class="tag miss">${i+1}. ${esc(s)}</span>`).join("")||"<p>No gaps for this role. Great work.</p>";
u.skillScore=a.score;persist(u);
function local(){const m=a.missing;return{summary:"Offline plan (start the backend with a Gemini key for a personalised one). Close your gaps in priority order, then build one project per skill cluster.",strengths:a.have.slice(0,4),resume_tips:["Add measurable results to each project","List the tech stack for every project","Keep it to one page"],roadmap:m.map((s,i)=>({week:"Week "+(i*1+1)+(i%2?"":"-"+(i+2)),goal:"Learn "+s,tasks:["Finish a beginner course","Build a small project using "+s]}))}}
function show(j){ai.innerHTML=`<p style="font-size:1.05rem">${esc(j.summary)}</p><div class="g2" style="margin-top:20px"><div><h3>Strengths</h3>${(j.strengths||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}<h3 style="margin-top:20px">Resume tips</h3><ul class="muted">${(j.resume_tips||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div><div><h3>Roadmap</h3><ul class="steps">${(j.roadmap||[]).map((w,i)=>`<li style="align-items:flex-start"><span class="dot done">${i+1}</span><div><b>${esc(w.week)}: ${esc(w.goal)}</b><div class="muted" style="font-size:.92rem">${(w.tasks||[]).map(esc).join(" &middot; ")}</div></div></li>`).join("")}</ul></div></div>`}
async function insights(){go.disabled=true;go.textContent="Thinking...";
 try{show(await api("/api/career/insights",{role:u.role,skills:a.have,missing:a.missing,resumeText:u.resumeText}))}
 catch(e){show(local());toast("AI unavailable: "+e.message)}go.disabled=false;go.textContent="Regenerate"}
</script></body></html>
