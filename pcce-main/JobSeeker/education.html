<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning - SkillBridge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-auth="1"><div id="nav"></div><main><div class="page-head"><div><h1>Learning</h1><p>Courses picked from your missing skills.</p></div></div>
<div class="tabs"><button id="f" class="on" onclick="show('free')">Free</button><button id="p" onclick="show('paid')">Paid</button></div>
<div class="card" style="margin-bottom:32px"><label style="margin-top:0" for="q">Search any course</label><div class="row"><input id="q" placeholder="e.g. system design" style="flex:1;min-width:220px"><button class="btn alt" onclick="go('yt')">YouTube</button><button class="btn alt" onclick="go('co')">Coursera</button></div></div>
<h2>Recommended for you</h2><div class="grid" id="list"></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>
const miss=analyse(DB.user).missing;let type="free";
function show(t){type=t;f.className=t=="free"?"on":"";p.className=t=="paid"?"on":"";draw()}
function draw(){const c=COURSES.filter(c=>c.type==type&&(miss.length?miss.includes(c.skill):(ROLES[DB.user.role]||[]).includes(c.skill)));
 list.innerHTML=c.map(c=>`<div class="card course"><span class="tag miss">${esc(c.skill)}</span><h3>${esc(c.title)}</h3><p class="muted">${esc(c.provider)}</p><a class="btn alt" target="_blank" rel="noopener" href="${esc(c.url)}">Open course</a></div>`).join("")||"<div class=empty>No courses found.</div>"}
function go(w){const s=encodeURIComponent(q.value||"programming");window.open(w=="yt"?"https://www.youtube.com/results?search_query="+s+"+course":"https://www.coursera.org/search?query="+s,"_blank","noopener")}
draw();
</script></body></html>
