<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobs - SkillBridge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-auth="1"><div id="nav"></div><main><div class="page-head"><div><h1>Jobs and internships</h1><p id="note"></p></div><span class="sp"></span><div style="min-width:240px"><label style="margin:0 0 6px" for="fld">Field</label><select id="fld" onchange="draw()"></select></div></div><div class="grid" id="list"></div><p class="muted" style="margin-top:24px;font-size:.88rem">Listings are sample data for demonstration, not live openings.</p></main><script src="js/data.js"></script><script src="js/app.js"></script><script>
const u=DB.user,s=overall(u),have=analyse(u).have;
note.textContent=s>=70?"You are ready. Apply below.":"Your score is "+s+". Jobs unlock at 70: close skill gaps or take the mock interview.";
fld.innerHTML="<option>All</option>"+Object.keys(ROLES).map(r=>`<option ${r==u.role?"selected":""}>${r}</option>`).join("");
function draw(){list.innerHTML=JOBS.filter(j=>fld.value=="All"||j.field==fld.value).map(j=>{const ok=s>=j.minScore;
 return`<div class="card"><div class="row"><span class="tag ink" style="margin:0">${j.type}</span><span class="sp"></span><span class="muted">${j.loc}</span></div><h3 style="margin-top:14px">${j.title}</h3><b>${j.company}</b><p class="muted" style="margin:10px 0">Eligibility: ${j.eligibility}</p><div style="margin-bottom:16px">${j.skills.map(k=>`<span class="tag ${have.includes(k)?"":"miss"}">${k}</span>`).join("")}</div><div class="row"><button class="btn" ${ok?"":"disabled"} onclick="toast('Application flow coming soon')">${ok?"Apply":"Locked"}</button><span class="muted" style="font-size:.88rem">Needs score ${j.minScore}+</span></div></div>`}).join("")||"<div class=empty>No jobs in this field yet.</div>"}
draw();
</script></body></html>
