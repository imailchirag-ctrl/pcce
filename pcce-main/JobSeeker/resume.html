<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume - SkillBridge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-auth="1"><div id="nav"></div><main><div class="page-head"><div><h1>Your resume</h1><p>Upload a file or build one here. AI reads it to find your skills.</p></div></div>
<div class="g2"><div><div class="tabs"><button id="t1" class="on" onclick="tab(1)">Upload</button><button id="t2" onclick="tab(2)">Build here</button></div>
<div id="p1" class="card"><label style="margin-top:0" for="file">Upload a PDF, image or .txt resume</label><input type="file" id="file" accept=".txt,.pdf,.png,.jpg,.jpeg"><p class="muted" style="margin:14px 0 0" id="st">PDFs and images are read by Gemini (needs the backend running). Have a Word file? Save it as PDF first.</p></div>
<div id="p2" class="card hide"><label style="margin-top:0">Summary</label><textarea id="sum"></textarea><label>Education</label><input id="edu"><label>Skills</label><input id="sk"><label>Projects (one per line)</label><textarea id="pr"></textarea><label>Achievements</label><textarea id="ach"></textarea><p style="margin:20px 0 0"><button class="btn alt" onclick="build()">Build preview</button></p></div></div>
<div class="card"><h2>Preview</h2><pre id="prev" style="white-space:pre-wrap;font:inherit;color:var(--ink2);margin:0 0 24px;max-height:460px;overflow:auto">Nothing yet.</pre><div class="row"><button class="btn" onclick="saveR()">Save and analyse</button><button class="btn alt noprint" onclick="window.print()">Print / PDF</button></div></div></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>
let text=DB.user.resumeText||"";prev.textContent=text||"Nothing yet.";
function tab(n){p1.classList.toggle("hide",n!=1);p2.classList.toggle("hide",n!=2);t1.className=n==1?"on":"";t2.className=n==2?"on":""}
function setText(t){text=t;prev.textContent=t||"Nothing yet."}
file.onchange=async e=>{const f=e.target.files[0];if(!f)return;
 if(f.size>6e6){st.textContent="File too large (max 6 MB).";return}
 if(/\.txt$/i.test(f.name)){setText(await f.text());st.textContent="Loaded "+f.name;return}
 st.textContent="Reading "+f.name+" with Gemini...";
 try{const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
  const mime=f.type||(/\.pdf$/i.test(f.name)?"application/pdf":"image/png");
  const j=await api("/api/resume/extract",{data,mime});setText(j.text);st.textContent="Done. Review the text, then save."}
 catch(err){st.textContent="Could not read the file: "+err.message+". Paste it in 'Build here' instead."}};
function build(){setText(`${DB.user.name}\n${DB.user.email}\n\nSUMMARY\n${sum.value}\n\nEDUCATION\n${edu.value}\n\nSKILLS\n${sk.value}\n\nPROJECTS\n${pr.value}\n\nACHIEVEMENTS\n${ach.value}`)}
function saveR(){if(!text.trim()){toast("Add your resume first");return}const u=DB.user;u.resumeText=text;u.skillScore=analyse(u).score;persist(u);location.href="career.html"}
</script></body></html>
