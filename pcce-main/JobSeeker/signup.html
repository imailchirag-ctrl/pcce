<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up - SkillBridge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><div class="authwrap"><form class="card auth" onsubmit="return signup(event)"><h2>Create your account</h2><p class="muted">Takes a minute. No payment needed.</p><label for="name">Full name</label><input id="name" required><label for="email">Email</label><input id="email" type="email" required><label for="pw">Password (min 6 characters)</label><input id="pw" type="password" minlength="6" required><label for="dream">Dream company</label><input id="dream" placeholder="e.g. Google"><label for="role">Target role</label><select id="role"></select><label for="skills">Skills you know (comma separated)</label><input id="skills" placeholder="python, sql, react"><p id="err" class="err" role="alert"></p><button class="btn lg" style="width:100%">Sign up</button><p style="margin:20px 0 0;text-align:center" class="muted">Have an account? <a href="login.html">Log in</a></p></form></div><script src="js/data.js"></script><script src="js/app.js"></script><script>
role.innerHTML=Object.keys(ROLES).map(r=>`<option>${r}</option>`).join("");
async function signup(e){e.preventDefault();const g=id=>document.getElementById(id).value.trim(),em=g("email").toLowerCase();
 if(DB.users.find(u=>u.email==em)){err.textContent="Email already registered. Log in instead.";return false}
 const u={name:g("name"),email:em,pwh:await hash(pw.value),dream:g("dream"),role:g("role"),skills:g("skills").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean),resumeText:"",skillScore:0,interviewScore:null,interviews:[]};
 DB.users=[...DB.users,u];DB.user=u;location.href="resume.html";return false}
</script></body></html>
